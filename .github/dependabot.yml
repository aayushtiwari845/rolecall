# Monthly, grouped dependency updates so the project keeps building as libraries,
# actions and base images move on. CI runs on every update PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend]
    schedule:
      interval: monthly
