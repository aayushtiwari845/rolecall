# Card-free hosting option: run ingestion, embeddings and LLM enrichment on GitHub's
# free runners against a hosted Postgres (e.g. Neon free tier with pgvector).
# Not needed when the worker container runs on a VM. Set the DATABASE_URL secret
# (and optionally GROQ_API_KEY / GEMINI_API_KEY) and enable the schedule.
name: Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ vars.INGEST_ON_ACTIONS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENV: production
      MODEL_CACHE_DIR: /tmp/models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
      - uses: actions/cache@v4
        with:
          path: /tmp/models
          key: models-bge-small-v1
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      - run: uv run rolecall seed
      - run: uv run rolecall ingest --stale-hours 3
      - run: uv run rolecall embed
      - run: uv run rolecall enrich-llm --limit 60
