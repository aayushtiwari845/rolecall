name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rolecall
          POSTGRES_PASSWORD: rolecall
          POSTGRES_DB: rolecall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rolecall" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://rolecall:rolecall@localhost:5432/rolecall
      # Without this the DB tests look for the local compose port and silently skip.
      TEST_DATABASE_URL: postgresql+psycopg://rolecall:rolecall@localhost:5432/rolecall
      ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check app
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json # pnpm version comes from its packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
