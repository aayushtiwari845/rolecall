# Production stack for a single small VM (Oracle Cloud Always Free Ampere A1 works well).
#   cp .env.example .env   # fill it in, ENV=production
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
# Caddy terminates TLS automatically for API_DOMAIN (any free hostname works, e.g.
# <your-ip>.sslip.io or a DuckDNS name).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rolecall
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sized for a 12 GB VM shared with the API and worker (the defaults assume 128 MB).
    # shared_buffers holds hot tables and the vector index; work_mem covers sorts and
    # hash joins in ranking queries; maintenance_work_mem speeds up HNSW index builds.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolecall"]
      interval: 10s
      retries: 10
    shm_size: 1gb

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD}@db:5432/rolecall
      ENV: production
      # Two uvicorn processes (read by uvicorn as --workers): concurrent searches no longer
      # queue behind each other. Each loads its own embedding and reranker models. Feed
      # caches stay correct across processes; per-minute rate limits are per process.
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD}@db:5432/rolecall
      ENV: production
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U rolecall -Fc rolecall > /backups/rolecall-$$(date +%u).dump; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
