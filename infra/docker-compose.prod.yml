# Production stack for a single small VM (Oracle Cloud Always Free Ampere A1 works well).
#   cp .env.example .env   # fill it in, ENV=production
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
# Caddy terminates TLS automatically for API_DOMAIN (any free hostname works, e.g.
# <your-ip>.sslip.io or a DuckDNS name).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rolecall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolecall"]
      interval: 10s
      retries: 10
    shm_size: 256mb

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD}@db:5432/rolecall
      ENV: production
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD}@db:5432/rolecall
      ENV: production
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U rolecall -Fc rolecall > /backups/rolecall-$$(date +%u).dump; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
