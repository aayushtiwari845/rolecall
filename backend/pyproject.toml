[project]
name = "rolecall"
version = "0.1.0"
description = "Job and internship recommendation engine: ingestion, hybrid retrieval, ranking and an LLM agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "selectolax>=0.3.21",
  "fastembed>=0.4.2",
  "openai>=1.55",
  "pypdf>=5.1",
  "openpyxl>=3.1",
  "apscheduler>=3.10,<4",
  "pyjwt[crypto]>=2.10",
  "typer>=0.13",
  "pyyaml>=6.0",
  "python-multipart>=0.0.17",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "optuna>=5.1.0",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
rolecall = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: tests that need a running Postgres (TEST_DATABASE_URL)"]
